apiVersion: batch/v1
kind: Job
metadata:
  name: 
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      name: 
    spec:
      restartPolicy: Never
      containers:
        - name: aiperf
          image: 
          env:
            - name: AIPERF_SERVICE_PROFILE_START_TIMEOUT
              value: ""
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install aiperf
              concurrency_array=(1 2 8 16 32 64 121 128 134)
              ARTIFACT_DIR="${BENCH_ARTIFACT_DIR:-/tmp/bench_artifacts}"
              for concurrency in "${concurrency_array[@]}"; do
                echo "Run concurrency: $concurrency"
                aiperf profile \
                  --artifact-dir "${ARTIFACT_DIR}/concurrency_${concurrency}" \
                  -m  \
                  --endpoint-type  \
                  -u  \
                  --tokenizer  \
                  --isl  --isl-stddev  \
                  --osl  --osl-stddev  \
                  --extra-inputs ignore_eos:true \
                  --extra-inputs "{\"nvext\":{\"ignore_eos\":true}}" \
                  --concurrency ${concurrency} \
                  --num-requests $(($concurrency*50)) \
                  --warmup-request-count $(($concurrency*2)) \
                  --random-seed 100 \
                  --ui  \
                  --streaming
              done